# DiscordKitBridge — configuração
# Depois de editar, use /dk reload.

bridge:
  enabled: true

  # Como o plugin conversa com o bot:
  #   poll   = o PLUGIN consulta o bot (só conexões de saída). Use em hospedagens que NÃO abrem porta
  #            de entrada (ex.: planos gratuitos). É o modo padrão.
  #   server = o plugin abre uma API REST (/api/v1/...) e o BOT chama o plugin. Exige uma porta liberada.
  mode: "poll"

  # Token compartilhado com o bot. Deixe vazio: um token forte é gerado na primeira execução.
  # Alternativa mais segura: defina a variável de ambiente DKB_SECRET (ela tem prioridade sobre este campo).
  secret: ""

  poll:
    # Endereço público do seu bot (onde roda bot-integration/asthen-bridge.js). Use HTTPS.
    url: "https://SEU-BOT.exemplo.com"
    # Usado no modo tradicional (long-poll.enabled: false) e como pausa mínima se o bot responder vazio na hora.
    interval-seconds: 3
    max-per-poll: 5
    connect-timeout: 10
    # Precisa ser MAIOR que long-poll.wait-seconds (o plugin corrige sozinho se não for).
    http-timeout: 35
    long-poll:
      # true = o bot segura a consulta até chegar um pedido (entrega quase instantânea, bem menos consultas vazias).
      # Exige BOT-ASTHEN 2.12.0 ou mais novo. false = consulta a cada interval-seconds (modo antigo).
      enabled: true
      # Quanto o bot pode segurar cada consulta (1 a 25 segundos; o bot limita em 25).
      wait-seconds: 20

  server:
    # 127.0.0.1 = só a própria máquina. Para outro endereço use firewall e TLS (proxy reverso).
    host: "127.0.0.1"
    port: 8080

platform:
  # Prefixo que o Floodgate coloca nos nomes de jogadores Bedrock em servidores Java.
  floodgate-prefix: "."
  # Sem Floodgate a plataforma não pode ser comprovada. false = recusa pedidos Bedrock (recomendado).
  # true = aceita quem tem o prefixo no nome (qualquer jogador Java poderia imitar isso).
  allow-unverified-bedrock: false

kits:
  allow-discord-delivery: true
  # true  = só entrega a quem está online.
  # false = se estiver offline, guarda o kit e entrega quando o jogador entrar.
  require-online: true

delivery:
  # Inventário cheio: true = guarda o kit INTEIRO e o jogador recebe com /dk claim (ou ao entrar).
  #                   false = recusa o pedido (nada é entregue).
  pending-if-inventory-full: true
  # Recusa um segundo pedido idêntico (mesmo jogador + kit) enquanto o primeiro está em andamento.
  prevent-duplicate: true

security:
  # Máximo de chamadas por minuto, por IP (modo server).
  rate-limit: 10
  # Segundos até um pedido que não foi processado ser encerrado com TIMEOUT.
  request-timeout: 30
  max-body-bytes: 4096

# Kit Inicial: entregue na PRIMEIRA vez do jogador e toda vez que ele morre. Entregue pelo próprio plugin, SEM a Shulker Box (só os itens de dentro).
# Nunca aparece no bot do Discord, não pode ser pedido por lá e nada sobre ele é enviado ao bot.
# Para criar: segure uma Shulker Box com os itens e use /dk create Kit_Inicial
starter-kit:
  enabled: true
  # Nome do kit cadastrado com /dk create. Esse nome fica reservado: o bot nunca o vê.
  name: "Kit_Inicial"
  # O mesmo jogador nunca recebe duas vezes dentro deste tempo, seja qual for o gatilho
  # (evita kit duplo ao entrar e clicar no aldeão logo em seguida, ou ao morrer no Nether e renascer no Overworld).
  cooldown-seconds: 10
  on-join:
    enabled: true
    # Ao entrar no servidor, não entrega se o jogador estiver nestes mundos (o LobbyGuard coloca todo mundo no lobby;
    # lá o kit seria inútil, então ele vem ao clicar no aldeão). Deixe a lista vazia ([]) para entregar também no lobby.
    skip-worlds: ["lobby"]
  # Entrega logo depois de renascer
  on-death: true
  # Entrega ao ir de um mundo a outro. É o aldeão do LobbyGuard: lobby -> sobrevivência.
  # Use os mesmos nomes de worlds.lobby / worlds.survival do config do LobbyGuard.
  on-enter-world:
    enabled: true
    from: "lobby"
    to: "survival"
  # true = ao entrar no servidor / entrar na sobrevivência pelo aldeão, só recebe quem NUNCA recebeu o kit
  # (fica salvo em data/starter-received.txt). Morrer entrega sempre. false = entrega a cada entrada (spam do aldeão).
  first-time-only: true
  # Inventário cheio: o que não couber cai aos pés do jogador (só ele consegue pegar). false = o que sobra se perde.
  drop-if-full: true
  # Mensagem no chat (& = cor). Vazio = sem mensagem.
  message: "&aVocê recebeu o &lKit Inicial&a!"

logs:
  # Alterar este valor exige reiniciar o servidor.
  enabled: true
  retention-days: 30
